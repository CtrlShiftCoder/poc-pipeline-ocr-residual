[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-ocr"
version = "1.0.0"
description = "Pipeline OCR residual para boletas chilenas (Stage1 OCR + Stage2 matching)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "CtrlShiftCoder"}]
dependencies = [
    "paddleocr>=2.7.0",
    "opencv-python-headless>=4.8.0",
    "rapidfuzz>=3.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "azure-storage-blob>=12.19.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
panel = ["streamlit>=1.28.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
residual-ocr = "residual_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
residual_ocr = ["notifications/templates/*.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
